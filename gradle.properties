# Enable Gradle Build Cache and Configuration Cache for fast builds
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# JVM Heap and Encoding Configuration
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED