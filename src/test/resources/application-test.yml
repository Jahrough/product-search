spring:
  application:
    name: product-search-test

  # Database Configuration for Test Containers & JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # Redis Configuration for Caching Tests
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Kafka Consumer Configuration for Event Ingestion Tests
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: product-search-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: dev.jahlopez.productsearch.event.ProductEvent
        spring.json.trusted.packages: "dev.jahlopez.productsearch.*,dev.jahlopez.productcatalog.event.*"
        spring.json.use.type.headers: false

# Application Domain Configurations
app:
  opensearch:
    uris: ${OPENSEARCH_URIS:http://localhost:9200}
  kafka:
    topic:
      product-events: product-events

# Resilience4j Circuit Breaker Test Configurations
resilience4j:
  circuitbreaker:
    instances:
      openSearchService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        ignore-exceptions:
          - dev.jahlopez.productsearch.exception.ResourceNotFoundException
          - java.lang.IllegalStateException

# Comprehensive Test Logging Levels
logging:
  level:
    dev.jahlopez.productsearch: DEBUG
    dev.jahlopez.productsearch.kafka: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.test: INFO
    org.opensearch.client: DEBUG