server:
  port: 8081

spring:
  application:
    name: product-search

  # JPA & Database Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration for Query Caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: product-search-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: dev.jahlopez.productsearch.event.ProductEvent
        spring.json.trusted.packages: dev.jahlopez.productsearch.event

# Application Domain Configurations
app:
  opensearch:
    uris: ${OPENSEARCH_URIS:http://localhost:9200}
  kafka:
    topic:
      product-events: product-events

# Resilience4j Fault Tolerance Configurations
resilience4j:
  circuitbreaker:
    instances:
      openSearchService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - dev.jahlopez.productsearch.exception.ResourceNotFoundException

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Enterprise Observability, Actuator & Health Probes
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}